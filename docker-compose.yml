services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_healthy

  rag-service:
    build: ./rag-service
    env_file:
      - ./rag-service/.env
    ports:
      - "${PYTHON_PORT}:8000"
    volumes:
      - rag_videos:/app/videos
      - rag_transcribe:/app/transcribe
      - chroma_db:/app/chroma_db

  media-worker:
    build: ./worker
    env_file:
      - ./worker/.env
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval '
          try { rs.status().ok }
          catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}).ok }
        '
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:latest
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
  rag_videos:
  rag_transcribe:
  chroma_db:
