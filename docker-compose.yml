services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      - redis
      - mongodb

  rag-service:
    build: ./rag-service
    env_file:
      - ./rag-service/.env
    ports:
      - "${PYTHON_PORT}:8000"
    volumes:
      - rag_videos:/app/videos
      - rag_transcribe:/app/transcribe
      - chroma_db:/app/chroma_db

  media-worker:
    build: ./worker
    env_file:
      - ./worker/.env
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    command:
      - mongod
      - --bind_ip_all
      - --replSet
      - rs0
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:latest
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
  rag_videos:
  rag_transcribe:
  chroma_db:
